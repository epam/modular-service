[project]
name = "modular-service"
description = "Service that allows to manage common modular entities"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
version = "3.3.2"
dependencies = [
    "modular-sdk~=7.1.10",
    "pydantic~=2.8.2",
    "python-dateutil>=2.9.0.post0",
    "routes~=2.5.1",
    "typing-extensions~=4.12.2",
]

[dependency-groups]
onprem = [
    "bcrypt~=4.1.2",
    "bottle~=0.13.4",
    "cryptography==43.0.3",
    "gunicorn~=23.0.0",
    "hvac~=2.1.0",
    "jwcrypto~=1.5.6",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.pyright]
pythonVersion = "3.10"
reportIncompatibleMethodOverride = "warning"
executionEnvironments = [
    {root = "src/", pythonVersion = "3.10"},
    {root = "tests/", pythonVersion = "3.10", extraPaths = ["src/"]}
]

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
